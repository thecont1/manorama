name = "manorama"
main = "./dist/index.js"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PUBLIC_HOST = "manorama.xyz"
# Production public origin — Vendo derives its OAuth/MCP resource URLs
# and audience binding from this behind the reverse proxy.
VENDO_BASE_URL = "https://manorama.xyz"
# VENDO_API_KEY and the session signing key are SECRETS:
# `bunx wrangler secret put VENDO_API_KEY` — never in this file.
# HOST_API_JWT_SECRET signs the Dropbox session cookie.

[[d1_databases]]
binding = "DB"
database_name = "manorama"
database_id = "23a75dd6-1d27-4f61-afc0-79b83c30cee7"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true
# Sample 100% initially; drop to 0.1 once the deployment is stable.
head_sampling_rate = 1

[[routes]]
pattern = "manorama.xyz"
custom_domain = true

# Optional future adapter binding. Enable when switching ImageSource to R2Source.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "your-manorama-images"
