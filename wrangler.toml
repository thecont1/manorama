name = "manorama-italy-2018"
main = "./dist/index.js"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = false

