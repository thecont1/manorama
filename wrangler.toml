name = "manorama"
main = "./dist/index.js"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PUBLIC_HOST = "manorama.xyz"
# Production public origin — Vendo derives its OAuth/MCP resource URLs
# and audience binding from this behind the reverse proxy.
VENDO_BASE_URL = "https://manorama.xyz"
# VENDO_API_KEY and the session signing key are SECRETS:
# `bunx wrangler secret put VENDO_API_KEY` — never in this file.
# HOST_API_JWT_SECRET signs the Dropbox session cookie.
# GOOGLE_DRIVE_API_KEY enables public Google Drive folder ingestion
# (iCloud shared albums need no secret).
# Stripe web billing: STRIPE_PRO_PAYMENT_LINK is a public buy.stripe.com URL
# (safe in vars). STRIPE_WEBHOOK_SIGNING_SECRET is a SECRET:
# `bunx wrangler secret put STRIPE_WEBHOOK_SIGNING_SECRET`.
# The link below is TEST mode for local dev — the dashboard suppresses
# test-mode links on the public host, so the live link MUST land here
# before launch or Upgrade degrades to a mailto.
STRIPE_PRO_PAYMENT_LINK = "https://buy.stripe.com/test_6oU3cxafo3TX0PE6lFdjO00"

[[d1_databases]]
binding = "DB"
database_name = "manorama"
database_id = "23a75dd6-1d27-4f61-afc0-79b83c30cee7"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true
# Sample 100% initially; drop to 0.1 once the deployment is stable.
head_sampling_rate = 1

[triggers]
crons = ["17 3 * * *"]

[[routes]]
pattern = "manorama.xyz"
custom_domain = true

# Optional future adapter binding. Enable when switching ImageSource to R2Source.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "your-manorama-images"
