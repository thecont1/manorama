name = "manorama"
main = "./dist/index.js"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# Secrets live in Worker bindings — never in this file.
# See AGENTS.md §6 (Secrets) for details.

[[d1_databases]]
binding = "DB"
database_name = "manorama"
database_id = "23a75dd6-1d27-4f61-afc0-79b83c30cee7"
migrations_dir = "migrations"

[[routes]]
pattern = "manorama.xyz"
custom_domain = true

[vars]
PUBLIC_HOST = "manorama.xyz"
STRIPE_PRO_PAYMENT_LINK = "https://buy.stripe.com/test_6oU3cxafo3TX0PE6lFdjO00"
# Set ANDROID_APP_LINK_SHA256 as a deployment secret/variable to the real
# release certificate fingerprint before claiming verified Android App Links.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true
# Sample 100% initially; drop to 0.1 once the deployment is stable.
head_sampling_rate = 1

[triggers]
crons = ["17 3 * * *"]

[env.production]
workers_dev = false

[[env.production.routes]]
pattern = "manorama.xyz"
custom_domain = true

[env.production.vars]
PUBLIC_HOST = "manorama.xyz"
STRIPE_PRO_PAYMENT_LINK = "https://buy.stripe.com/test_6oU3cxafo3TX0PE6lFdjO00"
# ANDROID_APP_LINK_SHA256 is intentionally not guessed or committed here.

[[env.production.d1_databases]]
binding = "DB"
database_name = "manorama"
database_id = "23a75dd6-1d27-4f61-afc0-79b83c30cee7"
migrations_dir = "migrations"

# Staging mirrors production's retired-decrypt posture on purpose — it is the
# canary for M7 (final key retirement), so LEGACY_ENCRYPTED_DECRYPT is
# deliberately absent here. The production cohort migration enables it in
# production only, for the window, then removes it again.
[env.staging]
workers_dev = true

[env.staging.vars]
PUBLIC_HOST = "manorama-staging.workers.dev"
STRIPE_PRO_PAYMENT_LINK = "https://buy.stripe.com/test_6oU3cxafo3TX0PE6lFdjO00"

# This is the production database — staging deliberately shares its rows so
# the cohort posture is exercised against real gallery shapes. There is no
# staging-only schema: migrations are applied only through the production
# workflow (`d1 migrations apply manorama --remote`, which targets the
# database name, never an env), and the staged SQL files are applied the
# same way.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "manorama"
database_id = "23a75dd6-1d27-4f61-afc0-79b83c30cee7"
migrations_dir = "migrations"

# Optional future adapter binding. Enable when switching ImageSource to R2Source.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "your-manorama-images"
