name: Windows desktop build

# Packaging remains manual and owner-controlled (#40). PRs run tests only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'crates/event-clustering/**'
      - 'fixtures/event-clustering/**'
      - '.github/workflows/desktop-windows.yml'

# The build runs third-party install scripts; they get a read-only token and
# no copy of it in .git/config.
permissions:
  contents: read

jobs:
  test-events-windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/manorama-events-tauri-target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test portable metadata engine and Windows cloud flags
        run: cargo test --locked --manifest-path Cargo.toml -p event-clustering --all-features

  test-shell-windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/manorama-events-tauri-target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build local frontend for Tauri context (no provider credentials)
        run: bun run build:desktop
      - name: Test Rust shell private storage and event boundaries
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

  build-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # The publish-provider OAuth client ids are public app identifiers
      # baked into the bundle through process.env -> import.meta.env. A
      # missing one silently ships that provider as "Not configured in this
      # build", so the check fails before tauri build starts.
      - name: Require the publish-provider client identifiers
        shell: bash
        env:
          MANORAMA_DESKTOP_DROPBOX_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_DROPBOX_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          missing=0
          for name in MANORAMA_DESKTOP_DROPBOX_CLIENT_ID MANORAMA_DESKTOP_GOOGLE_CLIENT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set for this repository. The desktop share lane bakes it into the bundle; without it that provider renders 'Not configured in this build'. Set it under Settings -> Secrets and variables -> Actions -> Variables."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build desktop bundles
        env:
          MANORAMA_DESKTOP_DROPBOX_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_DROPBOX_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: bunx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: manorama-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
