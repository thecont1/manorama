name: Windows desktop build

# Manual only: release control stays with the owner (#40). Dispatch it,
# wait for the artifact, download the .exe/.msi.
on:
  workflow_dispatch:

# The build runs third-party install scripts; they get a read-only token and
# no copy of it in .git/config.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build desktop bundles
        run: bunx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: manorama-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
