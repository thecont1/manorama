name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/iphone-redesign]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Sync Vendo knowledge (docs changed only, main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('docs/**') != ''
        env:
          VENDO_API_KEY: ${{ secrets.VENDO_API_KEY }}
        run: bunx vendo knowledge sync

      - name: Generated Vendo tools are in sync with the OpenAPI contract
        run: bun run vendo:check

      - name: Build
        run: bun run build

      - name: Build native bundle
        run: bun run build:native

      - name: Build desktop bundle
        run: bun run build:desktop
