name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/iphone-redesign]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Build native bundle
        run: bun run build:native

      - name: Build desktop bundle
        run: bun run build:desktop
