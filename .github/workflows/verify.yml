name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/iphone-redesign]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require executable tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -s -z -- 'scripts/*.sh' | while IFS= read -r -d '' entry; do
            mode="${entry%% *}"
            path="${entry#*$'\t'}"
            if [ "$mode" != "100755" ]; then
              echo "::error::$path is tracked with mode $mode, expected 100755"
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Build native bundle
        run: bun run build:native

      - name: Build desktop bundle
        run: bun run build:desktop

  rust-event-core:
    name: Rust event core (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        features: ['', 'fs-scan', 'android', 'fs-scan,android']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: event-sources
        name: Check event core sources
        run: |
          if [ -f crates/event-clustering/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/manorama-events-rust-target" >> "$GITHUB_ENV"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.event-sources.outputs.present == 'true'
      - name: Test root workspace and shared golden fixtures
        if: steps.event-sources.outputs.present == 'true'
        run: cargo test --locked -p event-clustering --features '${{ matrix.features }}'

  macos-boundary:
    name: Swift engine and macOS boundary
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: event-sources
        name: Check Swift event sources
        run: |
          if [ -f native/EventClustering/Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "MANORAMA_SWIFT_SCRATCH=$RUNNER_TEMP/event-clustering-build" >> "$GITHUB_ENV"
            echo "MANORAMA_SWIFT_MODULE_CACHE=$RUNNER_TEMP/event-clustering-modules" >> "$GITHUB_ENV"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Xcode 27.1 and the macOS SDK
        if: steps.event-sources.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Xcode 27.1 is not installed at $DEVELOPER_DIR"
            exit 1
          fi
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::$DEVELOPER_DIR provides macOS SDK $sdk, expected 26 or newer"
            exit 1
          fi

      - name: Swift event-clustering tests
        if: steps.event-sources.outputs.present == 'true'
        run: scripts/test-event-clustering.sh

      - name: macOS boundary tests
        if: steps.event-sources.outputs.present == 'true'
        env:
          # Shared runners scan measurably slower than a development machine;
          # the functional and memory assertions stay strict, only the
          # wall-clock budgets double.
          MANORAMA_PERF_BUDGET_SCALE: '3'
        run: scripts/test-macos-boundary.sh
