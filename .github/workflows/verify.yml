name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Generated Vendo tools are in sync with the OpenAPI contract
        run: bun run vendo:check

      - name: Build
        run: bun run build
