name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/iphone-redesign]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Detect docs changes in this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: docs
        # Before may be unknown (zero SHA or missing history); an
        # indeterminate diff syncs rather than silently skipping, since the
        # sync is idempotent but a missed one drifts the knowledge base.
        run: |
          changed=true
          before='${{ github.event.before }}'
          if [ "$before" != "0000000000000000000000000000000000000000" ] && \
             git diff --name-only "$before" '${{ github.sha }}' > /tmp/push-diff && \
             ! grep -q '^docs/' /tmp/push-diff; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Sync Vendo knowledge (docs changed only, main pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.docs.outputs.changed == 'true'
        env:
          VENDO_API_KEY: ${{ secrets.VENDO_API_KEY }}
        run: bunx vendo knowledge sync

      - name: Generated Vendo tools are in sync with the OpenAPI contract
        run: bun run vendo:check

      - name: Build
        run: bun run build

      - name: Build native bundle
        run: bun run build:native

      - name: Build desktop bundle
        run: bun run build:desktop
