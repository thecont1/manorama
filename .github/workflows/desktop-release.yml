name: Desktop release

# Owner-driven only (#40): push a v* tag, or dispatch with an existing
# tag's name. Builds run script-heavy tooling (bun install, tauri build)
# under a read-only token and hand their bundles to the release job —
# the only job that can write — which drafts a release for review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Mac ships only from the SwiftUI shell — the Tauri desktop is
          # deprecated on macOS (scripts/build-macos.sh compiles macos/
          # ManoramaMac with swiftc, arm64 only; there is no Intel build).
          # The xcode-27 image is the one that carries Xcode 27.x — the
          # generic macos-latest labels track the stable SDK and do not.
          - os: xcode-27
            swiftui: true
            asset: macos-arm64
            bundles: build/dmg/*.dmg
          - os: windows-latest
            asset: windows
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          # 22.04 keeps the AppImage/.deb runnable on older glibc.
          - os: ubuntu-22.04
            asset: linux
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate the release tag
        if: github.event_name == 'workflow_dispatch'
        # `case` is bash; the Windows runner's default shell is PowerShell, so
        # the check has to name its shell or the dispatch dies before it builds.
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag must be a version tag like v0.1.0"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # refs/tags/… fails the job on a missing tag, long before the
          # release job can run.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      # Names what the run can actually see, without printing any value. A
      # credential that reads MISSING here is not registered for this
      # repository — check the spelling, and that it sits under Settings ->
      # Secrets and variables -> Actions, not in another repo, an environment,
      # or the Variables tab (variables arrive as vars.*, never secrets.*).
      - name: Report which credentials this run can see
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MANORAMA_DESKTOP_DROPBOX_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_DROPBOX_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          # APPLE_APP_SPECIFIC_PASSWORD is the long name the same credential is
          # often stored under; it is reported here and accepted as a fallback.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%-28s set (%s characters)\n' "$name" "${#value}"
            else
              printf '%-28s MISSING\n' "$name"
              echo "::warning::$name is not set for this repository. The macOS leg requires the full APPLE_* set — it fails at the credential check before building — while the Windows and Linux legs do not use it."
            fi
          done
          # The publish-provider client ids live on the Variables tab — they
          # are public app identifiers baked into the bundle, not secrets.
          for name in MANORAMA_DESKTOP_DROPBOX_CLIENT_ID MANORAMA_DESKTOP_GOOGLE_CLIENT_ID MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%-28s set (%s characters)\n' "$name" "${#value}"
            else
              printf '%-28s MISSING\n' "$name"
              echo "::warning::$name is not set for this repository. Every leg bakes it into the bundle — a missing one ships that provider as 'Not configured in this build'. Set it under Settings -> Secrets and variables -> Actions -> Variables."
            fi
          done

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      # The Mac leg signs and notarizes, so it fails here — before the
      # certificate import — when any APPLE_* secret is absent, naming what
      # is missing without printing a value. Windows and Linux never reach
      # this step and do not need Apple credentials.
      - name: Require the macOS signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The checked-out ref may be an old tag that predates the helper —
          # a manual dispatch builds inputs.tag while this workflow file
          # comes from the dispatch ref. Resolve the script from the commit
          # that carries this workflow instead.
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/scripts/require-env.sh?ref=${{ github.workflow_sha }}" \
            -o "$RUNNER_TEMP/require-env.sh"
          bash "$RUNNER_TEMP/require-env.sh" APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID

      # The publish-provider OAuth client ids are public app identifiers
      # baked into the bundle at build time — they live as repository
      # variables, not secrets. A missing one does not fail the build; it
      # silently ships that provider as "Not configured in this build", so
      # the gate runs on every leg before any bundle exists.
      - name: Require the publish-provider client identifiers
        shell: bash
        env:
          MANORAMA_DESKTOP_DROPBOX_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_DROPBOX_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          missing=0
          for name in MANORAMA_DESKTOP_DROPBOX_CLIENT_ID MANORAMA_DESKTOP_GOOGLE_CLIENT_ID MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set for this repository. The desktop share lane bakes it into the bundle; without it that provider renders 'Not configured in this build'. Set it under Settings -> Secrets and variables -> Actions -> Variables."
              missing=1
            fi
          done
          exit "$missing"

      # The toolchain is validated before any credential is touched: a
      # runner that cannot supply the reviewed Xcode fails here, cheaply,
      # rather than after a keychain exists. The xcode-27 image carries
      # several Xcode builds, so the pin names the reviewed one; the
      # directory is exported for the job's later steps rather than through
      # a system-wide xcode-select.
      - name: Select Xcode 27.1 and require the macOS SDK
        if: matrix.swiftui == true
        run: |
          set -euo pipefail
          xcode="/Applications/Xcode_27.1.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::Xcode 27.1 is not installed at $xcode"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk"
          case "$sdk" in
            2[6-9]*|[3-9][0-9]*) ;;
            *) echo "::error::$xcode provides macOS SDK $sdk, but the shell needs 26 or newer."; exit 1 ;;
          esac

      # The macOS leg codesigns through scripts/build-macos.sh, so it fails at
      # codesign until the APPLE_* secrets exist — no unsigned fallback on
      # purpose. The certificate never enters the other legs.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          if ! security import signing.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>import.err; then
            cat import.err
            # "MAC verification failed" reads like a wrong password but is
            # usually an encoding mismatch: macOS refuses a .p12 that OpenSSL 3
            # wrote with its default encryption. Name both causes here so the
            # next run does not have to be diagnosed from a log.
            echo "::error::macOS could not import the signing certificate. If the line above says 'MAC verification failed', then either APPLE_CERTIFICATE_PASSWORD does not match APPLE_CERTIFICATE, or the .p12 was written with OpenSSL 3's default encryption — run scripts/prepare-macos-signing-cert.sh to produce an importable one."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm signing.p12

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        if: matrix.swiftui == true
        with:
          enable-cache: false

      # The SwiftUI shell is the only Mac build — swiftc + codesign via
      # scripts/build-macos.sh, then a drag-install DMG. The credential
      # check above guarantees the APPLE_* set, so notarytool + stapler run
      # unconditionally and stapler validate fails the job on an
      # unstapled or Invalid ticket.
      - name: Build the SwiftUI Mac bundle
        if: matrix.swiftui == true
        # notarytool --wait blocks on Apple's service with no ceiling of its
        # own; a stall there once burned the whole 6h job timeout. Fail the
        # step after an hour so a rerun --failed can retry while artifacts
        # from the other legs carry over.
        timeout-minutes: 60
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # Either name works; the app-specific password is what notarization
          # needs, and APPLE_APP_SPECIFIC_PASSWORD is the other common spelling.
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # build-macos.sh runs vite; these public client ids reach the
          # bundle through process.env -> import.meta.env (envPrefix
          # MANORAMA_DESKTOP_), exactly as .env.local does on a dev machine.
          MANORAMA_DESKTOP_DROPBOX_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_DROPBOX_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: |
          scripts/build-macos.sh release
          APP_BUNDLE=macos/ManoramaMac/build/manorama.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")
          DMG="build/dmg/manorama_${VERSION}_aarch64.dmg"
          if [ -f scripts/build-dmg.sh ]; then
            scripts/build-dmg.sh "$APP_BUNDLE" "$DMG"
          else
            # Manual dispatch can check out a tag predating styled DMGs.
            mkdir -p build/dmg-stage build/dmg
            cp -R "$APP_BUNDLE" build/dmg-stage/
            ln -s /Applications build/dmg-stage/Applications
            hdiutil create -volname manorama -srcfolder build/dmg-stage -ov -format UDZO "$DMG"
          fi
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Build desktop bundles
        if: runner.os != 'macOS'
        env:
          # tauri build -> bun run build:desktop -> vite; the same public
          # client ids bake in through process.env -> import.meta.env.
          MANORAMA_DESKTOP_DROPBOX_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_DROPBOX_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_ID: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_ID }}
          MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET: ${{ vars.MANORAMA_DESKTOP_GOOGLE_CLIENT_SECRET }}
        run: bunx tauri build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manorama-${{ matrix.asset }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: manorama-*
          merge-multiple: true
          path: dist

      # No checkout, no build scripts — this job only moves files that
      # already exist onto a draft release.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A concurrent pipeline may win the draft create — re-read so its
            # release satisfies this step instead of failing the whole release.
            gh release create "$TAG" --draft --title "manorama $TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          # A rerun must never rewrite a release that already went out —
          # only drafts accept uploads. Checked after resolution so the
          # create/fallback path is held to the same bar.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::$TAG is already published; cut a new tag instead"
            exit 1
          fi
          mapfile -d '' -t assets < <(find dist -type f -print0)
          if [ ${#assets[@]} -eq 0 ]; then echo "::error::no bundles to upload"; exit 1; fi
          gh release upload "$TAG" --clobber "${assets[@]}"

  publish-downloads:
    # Keeps downloads.manorama.xyz in step with every tag: the installers
    # land under v<tag>/ keys, history.json regenerates from the git tags
    # (scripts/build-download-history.mjs), and latest.json repoints all
    # three platforms — so the release-history page updates itself with
    # every build and needs no manual sync.
    needs: release
    runs-on: ubuntu-latest
    # Shares the manifest lock with android-release's publish job — both
    # rewrite latest.json and must not interleave read-modify-write. queue:max
    # keeps every pending publish; the default single slot would cancel one.
    concurrency:
      group: downloads-manifest
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # history.json needs every tag's ancestry

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: manorama-*
          merge-multiple: true
          path: dist

      - name: Publish installers and manifests to the downloads bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mac=""; win=""; linux=""
          # Artifacts keep their bundle subdirectories (msi/, nsis/, deb/,
          # appimage/) — a plain dist/* glob sees only the mac DMG at the root.
          shopt -s globstar nullglob
          for f in dist/**/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            type="application/octet-stream"
            case "$name" in
              *_aarch64.dmg) type="application/x-apple-diskimage"; mac="$name" ;;
              *_x64-setup.exe) win="$name" ;;
              *_amd64.AppImage) linux="$name" ;;
              *.msi) type="application/x-msi" ;;
              *.deb) type="application/vnd.debian.binary-package" ;;
            esac
            echo "uploading $name"
            bunx wrangler r2 object put "manorama-downloads/v${version}/${name}" --file "$f" --content-type "$type" --remote
          done
          bun scripts/build-download-history.mjs history.json
          # latest.json is shared with the Android pipeline, which owns the
          # mobile slot — carry it across instead of clobbering the field on
          # every desktop tag. A missing manifest just means no mobile
          # release has shipped yet; an unparseable one aborts below.
          # Only a confirmed-missing object earns the empty baseline — any
          # other read failure aborts rather than publishing over the mobile
          # fields this job does not own.
          if ! bunx wrangler r2 object get manorama-downloads/latest.json --pipe --remote > current-latest.json 2> current-latest.err; then
            if grep -qiE 'does not exist|NoSuchKey' current-latest.err; then
              echo '{}' > current-latest.json
            else
              cat current-latest.err >&2
              exit 1
            fi
          fi
          rm -f current-latest.err
          # Out-of-order tag runs can finish publishing backwards; an older
          # release must never regress the pointer. history.json still
          # publishes — it is rebuilt from every tag, not this run's.
          update="$(VERSION="$version" MAC="$mac" WIN="$win" LINUX="$linux" bun -e '
            if (!process.env.MAC || !process.env.WIN || !process.env.LINUX) {
              console.error("missing platform asset", { mac: process.env.MAC, win: process.env.WIN, linux: process.env.LINUX })
              process.exit(1)
            }
            let mobile, existingVersion
            const raw = (await Bun.file("current-latest.json").text()).trim()
            if (raw) {
              let current
              try { current = JSON.parse(raw) } catch (e) {
                console.error("latest.json is not valid JSON:", e.message); process.exit(1)
              }
              if (current && typeof current.mobile === "object" && current.mobile !== null) mobile = current.mobile
              if (current && typeof current.version === "string") existingVersion = current.version
            }
            const dotted = (v) => /^\d+(\.\d+)*$/.test(String(v)) ? String(v).split(".").map(Number) : null
            const cmp = (a, b) => {
              const pa = dotted(a), pb = dotted(b)
              if (!pa || !pb) return 0
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const d = (pa[i] ?? 0) - (pb[i] ?? 0)
                if (d) return d
              }
              return 0
            }
            if (existingVersion && cmp(existingVersion, process.env.VERSION) > 0) {
              console.log("skip")
            } else {
              const key = (name) => `v${process.env.VERSION}/${name}`
              const manifest = {
                version: process.env.VERSION,
                released: new Date().toISOString().slice(0, 10),
                assets: { mac: key(process.env.MAC), windows: key(process.env.WIN), linux: key(process.env.LINUX), all: [key(process.env.MAC)] },
              }
              if (mobile) manifest.mobile = mobile
              await Bun.write("latest.json", JSON.stringify(manifest, null, 2) + "\n")
              console.log("write")
            }
          ')"
          bunx wrangler r2 object put manorama-downloads/history.json --file history.json --content-type application/json --remote
          if [ "$update" = "write" ]; then
            bunx wrangler r2 object put manorama-downloads/latest.json --file latest.json --content-type application/json --remote
          else
            echo "latest.json already points at a newer release — pointer untouched"
          fi
