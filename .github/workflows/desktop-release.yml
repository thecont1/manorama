name: Desktop release

# Owner-driven only (#40): push a v* tag, or dispatch with an existing
# tag's name. Builds run script-heavy tooling (bun install, tauri build)
# under a read-only token and hand their bundles to the release job —
# the only job that can write — which drafts a release for review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Mac ships only from the SwiftUI shell — the Tauri desktop is
          # deprecated on macOS (scripts/build-macos.sh compiles macos/
          # ManoramaMac with swiftc, arm64 only; there is no Intel build).
          - os: macos-latest
            swiftui: true
            asset: macos-arm64
            bundles: build/dmg/*.dmg
          - os: windows-latest
            asset: windows
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          # 22.04 keeps the AppImage/.deb runnable on older glibc.
          - os: ubuntu-22.04
            asset: linux
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate the release tag
        if: github.event_name == 'workflow_dispatch'
        # `case` is bash; the Windows runner's default shell is PowerShell, so
        # the check has to name its shell or the dispatch dies before it builds.
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag must be a version tag like v0.1.0"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # refs/tags/… fails the job on a missing tag, long before the
          # release job can run.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      # Names what the run can actually see, without printing any value. A
      # credential that reads MISSING here is not registered for this
      # repository — check the spelling, and that it sits under Settings ->
      # Secrets and variables -> Actions, not in another repo, an environment,
      # or the Variables tab (variables arrive as vars.*, never secrets.*).
      - name: Report which credentials this run can see
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -uo pipefail
          # APPLE_APP_SPECIFIC_PASSWORD is the long name the same credential is
          # often stored under; it is reported here and accepted as a fallback.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%-28s set (%s characters)\n' "$name" "${#value}"
            else
              printf '%-28s MISSING\n' "$name"
              echo "::warning::$name is not set for this repository. Signing cannot complete without it; notarization is skipped silently when APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are absent."
            fi
          done

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      # The macOS leg codesigns through scripts/build-macos.sh, so it fails at
      # codesign until the APPLE_* secrets exist — no unsigned fallback on
      # purpose. The certificate never enters the other legs.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          if ! security import signing.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>import.err; then
            cat import.err
            # "MAC verification failed" reads like a wrong password but is
            # usually an encoding mismatch: macOS refuses a .p12 that OpenSSL 3
            # wrote with its default encryption. Name both causes here so the
            # next run does not have to be diagnosed from a log.
            echo "::error::macOS could not import the signing certificate. If the line above says 'MAC verification failed', then either APPLE_CERTIFICATE_PASSWORD does not match APPLE_CERTIFICATE, or the .p12 was written with OpenSSL 3's default encryption — run scripts/prepare-macos-signing-cert.sh to produce an importable one."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm signing.p12

      # The SwiftUI shell is the only Mac build — swiftc + codesign via
      # scripts/build-macos.sh, then a drag-install DMG. notarytool + stapler
      # run when the APPLE_ID trio is present, the same posture the tauri CLI
      # took before the Mac leg moved off it.
      - name: Build the SwiftUI Mac bundle
        if: matrix.swiftui == true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # Either name works; the app-specific password is what notarization
          # needs, and APPLE_APP_SPECIFIC_PASSWORD is the other common spelling.
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/build-macos.sh release
          APP_BUNDLE=macos/ManoramaMac/build/manorama.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")
          mkdir -p build/dmg-stage build/dmg
          cp -R "$APP_BUNDLE" build/dmg-stage/
          ln -s /Applications build/dmg-stage/Applications
          DMG="build/dmg/manorama_${VERSION}_aarch64.dmg"
          hdiutil create -volname manorama -srcfolder build/dmg-stage -ov -format UDZO "$DMG"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
          fi

      - name: Build desktop bundles
        if: runner.os != 'macOS'
        run: bunx tauri build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manorama-${{ matrix.asset }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: manorama-*
          merge-multiple: true
          path: dist

      # No checkout, no build scripts — this job only moves files that
      # already exist onto a draft release.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun must never rewrite a release that already went out —
            # only drafts accept uploads.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; cut a new tag instead"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --title "manorama $TAG" --generate-notes
          fi
          mapfile -d '' -t assets < <(find dist -type f -print0)
          if [ ${#assets[@]} -eq 0 ]; then echo "::error::no bundles to upload"; exit 1; fi
          gh release upload "$TAG" --clobber "${assets[@]}"

  publish-downloads:
    # Keeps downloads.manorama.xyz in step with every tag: the installers
    # land under v<tag>/ keys, history.json regenerates from the git tags
    # (scripts/build-download-history.mjs), and latest.json repoints all
    # three platforms — so the release-history page updates itself with
    # every build and needs no manual sync.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # history.json needs every tag's ancestry

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: manorama-*
          merge-multiple: true
          path: dist

      - name: Publish installers and manifests to the downloads bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mac=""; win=""; linux=""
          for f in dist/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            type="application/octet-stream"
            case "$name" in
              *_aarch64.dmg) type="application/x-apple-diskimage"; mac="$name" ;;
              *_x64-setup.exe) win="$name" ;;
              *_amd64.AppImage) linux="$name" ;;
              *.msi) type="application/x-msi" ;;
              *.deb) type="application/vnd.debian.binary-package" ;;
            esac
            echo "uploading $name"
            bunx wrangler r2 object put "manorama-downloads/v${version}/${name}" --file "$f" --content-type "$type" --remote
          done
          bun scripts/build-download-history.mjs history.json
          # latest.json is shared with the Android pipeline, which owns the
          # mobile slot — carry it across instead of clobbering the field on
          # every desktop tag. A missing/unparseable manifest just means no
          # mobile release has shipped yet.
          bunx wrangler r2 object get manorama-downloads/latest.json --pipe --remote > current-latest.json || echo '{}' > current-latest.json
          VERSION="$version" MAC="$mac" WIN="$win" LINUX="$linux" bun -e '
            if (!process.env.MAC || !process.env.WIN || !process.env.LINUX) {
              console.error("missing platform asset", { mac: process.env.MAC, win: process.env.WIN, linux: process.env.LINUX })
              process.exit(1)
            }
            let mobile
            try {
              const current = JSON.parse(await Bun.file("current-latest.json").text())
              if (current && typeof current.mobile === "object" && current.mobile !== null) mobile = current.mobile
            } catch {}
            const key = (name) => `v${process.env.VERSION}/${name}`
            const manifest = {
              version: process.env.VERSION,
              released: new Date().toISOString().slice(0, 10),
              assets: { mac: key(process.env.MAC), windows: key(process.env.WIN), linux: key(process.env.LINUX), all: [key(process.env.MAC)] },
            }
            if (mobile) manifest.mobile = mobile
            await Bun.write("latest.json", JSON.stringify(manifest, null, 2) + "\n")
          '
          bunx wrangler r2 object put manorama-downloads/history.json --file history.json --content-type application/json --remote
          bunx wrangler r2 object put manorama-downloads/latest.json --file latest.json --content-type application/json --remote
