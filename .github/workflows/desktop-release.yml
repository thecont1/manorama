name: Desktop release

# Owner-driven only (#40): push a v* tag, or dispatch with an existing
# tag's name. Builds run script-heavy tooling (bun install, tauri build)
# under a read-only token and hand their bundles to the release job —
# the only job that can write — which drafts a release for review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS arches build on the ARM runner; there is no Intel
          # runner worth keeping in the matrix.
          - os: macos-latest
            rustTarget: aarch64-apple-darwin
            asset: macos-arm64
            bundles: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            rustTarget: x86_64-apple-darwin
            asset: macos-x64
            bundles: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            rustTarget: ''
            asset: windows
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          # 22.04 keeps the AppImage/.deb runnable on older glibc.
          - os: ubuntu-22.04
            rustTarget: ''
            asset: linux
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate the release tag
        if: github.event_name == 'workflow_dispatch'
        # `case` is bash; the Windows runner's default shell is PowerShell, so
        # the check has to name its shell or the dispatch dies before it builds.
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag must be a version tag like v0.1.0"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # refs/tags/… fails the job on a missing tag, long before the
          # release job can run.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - name: Install the Rust target for this build
        if: matrix.rustTarget != ''
        run: rustup target add ${{ matrix.rustTarget }}

      # tauri.conf.json pins a Developer ID identity, so the macOS legs
      # fail at codesign until the APPLE_* secrets exist — no unsigned
      # fallback on purpose. The certificate never enters the other legs.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          if ! security import signing.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security 2>import.err; then
            cat import.err
            # "MAC verification failed" reads like a wrong password but is
            # usually an encoding mismatch: macOS refuses a .p12 that OpenSSL 3
            # wrote with its default encryption. Name both causes here so the
            # next run does not have to be diagnosed from a log.
            echo "::error::macOS could not import the signing certificate. If the line above says 'MAC verification failed', then either APPLE_CERTIFICATE_PASSWORD does not match APPLE_CERTIFICATE, or the .p12 was written with OpenSSL 3's default encryption — run scripts/prepare-macos-signing-cert.sh to produce an importable one."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm signing.p12

      # The tauri CLI notarizes itself (notarytool + staple) when the
      # APPLE_ID trio is in its environment — macOS only.
      - name: Build desktop bundles
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx tauri build --target ${{ matrix.rustTarget }}

      - name: Build desktop bundles
        if: runner.os != 'macOS'
        run: bunx tauri build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manorama-${{ matrix.asset }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: manorama-*
          merge-multiple: true
          path: dist

      # No checkout, no build scripts — this job only moves files that
      # already exist onto a draft release.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun must never rewrite a release that already went out —
            # only drafts accept uploads.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; cut a new tag instead"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --title "manorama $TAG" --generate-notes
          fi
          mapfile -d '' -t assets < <(find dist -type f -print0)
          if [ ${#assets[@]} -eq 0 ]; then echo "::error::no bundles to upload"; exit 1; fi
          gh release upload "$TAG" --clobber "${assets[@]}"
