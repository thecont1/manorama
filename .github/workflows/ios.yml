# Archive the Capacitor iOS app and hand the build to App Store Connect.
#
# The app is a shell around the web bundle, so the bundle is rebuilt here from
# the tagged commit and copied into the Xcode project before archiving — the
# uploaded build is never a stale copy of the web app.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_API_KEY_ID       the Key ID of an App Store Connect API key
#   APPSTORE_API_ISSUER_ID    its Issuer ID
#   APPSTORE_API_PRIVATE_KEY  the .p8 file's contents, newlines included
#
# The key needs the App Manager role so `-allowProvisioningUpdates` can create
# the distribution certificate and provisioning profile on the first run.
# Nothing else is needed: the team is set in the Xcode project, and
# ITSAppUsesNonExemptEncryption is already declared in Info.plist.
#
# Runs on a tag (`v*`) or by hand. Manual runs are the escape hatch when a
# submission has to be re-cut without a new tag.
#
# Until the key is in place the job warns and stops rather than failing, so a
# tag still ships the desktop release while the iOS half waits for its secrets.

name: iOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to App Store Connect
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    # The macos-15 image ships Xcode 26.3 but defaults to 16.4, and the app
    # uses iOS 26 APIs, so the toolchain is chosen explicitly below instead of
    # carries Xcode 26.x, but its default is 16.4 — and the app uses iOS 26
    # APIs, so the default decides whether this job compiles at all.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::no Xcode found on the runner image"
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk"
          # UIVerticalBarBehavior and UIView.reservedRegions are iOS 26 APIs.
          # Fail here, with a reason, rather than inside the Swift compiler.
          case "$sdk" in
            2[6-9]*|[3-9][0-9]*) ;;
            *) echo "::error::$latest provides iOS SDK $sdk, but the app needs 26 or newer — move this job to a newer runner image."; exit 1 ;;
          esac

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web bundle the app loads
        run: bun run build:native

      - name: Copy the bundle into the Xcode project
        run: bunx cap sync ios

      # Names what the run can actually see, without printing any value, so a
      # missing secret is diagnosed from the run page instead of guessed at.
      - name: Report which credentials this run can see
        id: key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          ready=true
          for name in APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%-26s set (%s characters)\n' "$name" "${#value}"
            else
              printf '%-26s MISSING\n' "$name"
              echo "::warning::$name is not set for this repository, so the workflow cannot see it. Check the spelling, and that it sits under Settings -> Secrets and variables -> Actions in this repo (not another repo, an environment, or the Variables tab)."
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
            chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          fi

      # App Store Connect rejects a build number it has already seen, so every
      # run stamps its own. The marketing version stays whatever the project
      # says (1.0) — bump that by hand when the version being submitted changes.
      - name: Stamp a unique build number
        if: steps.key.outputs.ready == 'true'
        run: (cd ios/App && xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER")

      - name: Archive
        if: steps.key.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            archive

      - name: Export and upload to App Store Connect
        if: steps.key.outputs.ready == 'true' && (github.event_name == 'push' || inputs.upload)
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # Kept even when the upload happened, so a failed App Store Connect
      # processing step can be re-run by hand instead of rebuilding.
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.ready == 'true'
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/App.xcarchive/**/*.app.dSYM
          if-no-files-found: warn
          retention-days: 14
