# Archive the Capacitor iOS app and hand the build to App Store Connect.
#
# The app is a shell around the web bundle, so the bundle is rebuilt here from
# the commit being built and copied into the Xcode project before archiving —
# the uploaded build is never a stale copy of the web app.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_API_KEY_ID               Key ID of an App Store Connect API key
#   APPSTORE_API_ISSUER_ID            its Issuer ID
#   APPSTORE_API_PRIVATE_KEY          the .p8 file's contents, newlines included
#   IOS_DIST_CERTIFICATE_BASE64       base64 of a .p12 holding "Apple Distribution"
#   IOS_DIST_CERTIFICATE_PASSWORD     the .p12's export password
#   IOS_PROVISIONING_PROFILE_BASE64   base64 of the App Store .mobileprovision
#
# Why the certificate and profile are supplied instead of relying on cloud
# signing: `xcodebuild archive` happily falls back to an iOS *development* team
# profile, and `-exportArchive` then fails with
#
#     error: exportArchive No signing certificate "iOS Distribution" found
#
# because a development profile cannot produce an App Store package. The export
# therefore signs manually with an Apple Distribution identity and the App Store
# provisioning profile; both are exported once from the account that owns the
# app with scripts/prepare-ios-signing-cert.sh.
#
# Only the *export* is manual, on purpose. The profile is an Xcode-managed one,
# and Xcode refuses to use it while CODE_SIGN_STYLE=Manual:
#
#     error: Provisioning profile "…" is Xcode managed, but signing settings
#            require a manually managed profile. (in target 'App')
#
# Forcing manual signing on the archive also strips the development team from
# the RevenueCat SPM package targets, so the archive keeps automatic signing and
# the export re-signs the archived app with the identity installed above.
#
# Runs on a tag (`v*`) or by hand. Manual runs are the escape hatch when a
# submission has to be re-cut without a new tag.
#
# Until the App Store Connect key is in place the job warns and stops rather
# than failing, so a tag still ships the desktop release while the iOS half
# waits for its secrets.

name: iOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to App Store Connect
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match the profile's Name exactly; it is read back from the installed
  # profile below, and the job fails loudly if the secret carries another one.
  PROFILE_NAME: 'iOS Team Store Provisioning Profile: in.thecontrarian.manorama'

jobs:
  archive:
    # The macos-15 image carries Xcode 26.x, but its default is 16.4 — and the
    # app needs the iOS 26 SDK, so the toolchain is chosen explicitly below.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Select an Xcode with the iOS 26 SDK
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::no Xcode found on the runner image"
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk"
          # App Review rejects binaries built with a beta SDK, and the app needs
          # iOS 26 APIs, so accept 26 or newer and refuse anything else here
          # rather than inside the Swift compiler.
          case "$sdk" in
            2[6-9]*|[3-9][0-9]*) ;;
            *) echo "::error::$latest provides iOS SDK $sdk, but the app needs 26 or newer — move this job to a newer runner image."; exit 1 ;;
          esac

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web bundle the app loads
        run: bun run build:native

      - name: Copy the bundle into the Xcode project
        run: bunx cap sync ios

      # Names what the run can actually see, without printing any value, so a
      # missing secret is diagnosed from the run page instead of guessed at.
      - name: Report which credentials this run can see
        id: key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -uo pipefail
          ready=true
          for name in APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_PRIVATE_KEY \
                      IOS_DIST_CERTIFICATE_BASE64 IOS_DIST_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%-34s set (%s characters)\n' "$name" "${#value}"
            else
              printf '%-34s MISSING\n' "$name"
              echo "::warning::$name is not set for this repository, so the workflow cannot see it. Check the spelling, and that it sits under Settings -> Secrets and variables -> Actions in this repo (not another repo, an environment, or the Variables tab)."
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
            chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          fi

      # Installs the Apple Distribution identity and the App Store profile into
      # a throwaway keychain, then proves the identity is usable before the
      # archive starts — a bad .p12 fails here with a clear message instead of
      # surfacing later as "No signing certificate found".
      - name: Install the distribution certificate and profile
        if: steps.key.outputs.ready == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$profiles/manorama-appstore.mobileprovision"
          installed="$(security cms -D -i "$profiles/manorama-appstore.mobileprovision" | plutil -extract Name raw -)"
          echo "profile: $installed"
          if [ "$installed" != "$PROFILE_NAME" ]; then
            echo "::error::the supplied profile is '$installed', but the workflow signs with '$PROFILE_NAME'."
            exit 1
          fi

          echo "identities in the build keychain:"
          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution"; then
            echo "::error::no Apple Distribution identity in IOS_DIST_CERTIFICATE_BASE64 (export the .p12 with its private key)."
            exit 1
          fi

      # App Store Connect rejects a build number it has already seen, so every
      # run stamps its own. The marketing version stays whatever the project
      # says (1.0) — bump that by hand when the version being submitted changes.
      - name: Stamp a unique build number
        if: steps.key.outputs.ready == 'true'
        run: (cd ios/App && xcrun agvtool new-version -all "$GITHUB_RUN_NUMBER")

      - name: Archive
        if: steps.key.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Automatic signing here, manual signing at export. Passing
          # CODE_SIGN_STYLE=Manual would reject the Xcode-managed App Store
          # profile and unset the team on the RevenueCat SPM targets.
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            archive

      - name: Export and upload to App Store Connect
        if: steps.key.outputs.ready == 'true' && (github.event_name == 'push' || inputs.upload)
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # Kept even when the upload happened, so a failed App Store Connect
      # processing step can be re-run by hand instead of rebuilding.
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.ready == 'true'
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/App.xcarchive/**/*.app.dSYM
          if-no-files-found: warn
          retention-days: 14
