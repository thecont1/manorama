name: iOS event verification

on:
  pull_request:
    paths:
      - 'native/**'
      - 'packages/core/**'
      - 'ios/**'
      - '.github/workflows/ios-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Check iOS event sources
        run: |
          if [ -f ios/App/App/EventClusteringPlugin.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  simulator:
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 18 Pro Max', 'iPad Pro 13-inch (M5)']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build:native --configLoader runner
      - run: bunx cap copy ios
      - name: Select an installed simulator
        env:
          DEVICE_NAME: ${{ matrix.device }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          devices = json.load(open(os.environ['RUNNER_TEMP'] + '/simulators.json'))['devices']
          matches = [(runtime, d['udid']) for runtime, group in devices.items() for d in group if d.get('isAvailable') and d['name'] == os.environ['DEVICE_NAME']]
          if not matches:
              raise SystemExit('Required simulator is not installed: ' + os.environ['DEVICE_NAME'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + sorted(matches)[-1][1] + '\n')
          PY
      - name: Build simulator tests (no signing or upload)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/event-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/event-spm" build-for-testing
      - name: Seed synthetic Photos media
        run: |
          set -euo pipefail
          fixture_prefix="event-demo-$(date +%s)-${RANDOM}-"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/event-derived/Build/Products/Debug-iphonesimulator/App.app"
          app_data="$(xcrun simctl get_app_container "$SIMULATOR_ID" in.thecontrarian.manorama data)"
          mkdir -p "$app_data/Documents"
          printf '%s\n' "$fixture_prefix" > "$app_data/Documents/event-fixture-prefix.txt"
          xcrun simctl launch "$SIMULATOR_ID" in.thecontrarian.manorama >/dev/null
          xcrun simctl terminate "$SIMULATOR_ID" in.thecontrarian.manorama >/dev/null
          xcrun simctl privacy "$SIMULATOR_ID" grant photos in.thecontrarian.manorama
          xcrun simctl privacy "$SIMULATOR_ID" grant photos in.thecontrarian.manorama.EventAssetImagesTests
          bun -e 'import sharp from "sharp"; await sharp({create:{width:1024,height:768,channels:3,background:"#da1680"}}).png().toFile(process.env.RUNNER_TEMP + "/event-synthetic.png")'
          xcrun simctl addmedia "$SIMULATOR_ID" "$RUNNER_TEMP/event-synthetic.png"
          xcrun swiftc scripts/seed-ios-event-photos.swift -o "$RUNNER_TEMP/event-seed"
          "$RUNNER_TEMP/event-seed" "$RUNNER_TEMP/event-photos" "$fixture_prefix"
          xcrun simctl addmedia "$SIMULATOR_ID" "$RUNNER_TEMP/event-photos/"*.jpg
      - name: Run seeded PhotoKit and lifecycle tests
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/event-derived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/event-spm" \
            -resultBundlePath "$RUNNER_TEMP/event-tests.xcresult" \
            -parallel-testing-enabled NO test-without-building
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: events-${{ matrix.device }}
          path: ${{ runner.temp }}/event-tests.xcresult
