apply plugin: 'com.android.application'

// Release credentials arrive as -P properties or environment variables —
// never a committed file. CI decodes ANDROID_KEYSTORE_BASE64 into a file
// and points MANORAMA_UPLOAD_KEYSTORE at it; a local release build without
// it stays unsigned rather than failing, and the workflow verifies the
// signature so an unsigned artifact can never slip onto a release.
def releaseProp = { String name -> project.findProperty(name) ?: System.getenv(name) }
def uploadKeystore = releaseProp('MANORAMA_UPLOAD_KEYSTORE')

android {
    namespace = "in.thecontrarian.manorama"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.thecontrarian.manorama"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI stamps the tag: -PMANORAMA_VERSION_NAME=0.4.0
        // -PMANORAMA_VERSION_CODE=400 (major·10000 + minor·100 + patch —
        // monotonic while each field stays under 100).
        versionCode Integer.parseInt(releaseProp('MANORAMA_VERSION_CODE') ?: '1')
        versionName releaseProp('MANORAMA_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The Android AdMob app id is a separate id from the iOS one and only
        // exists once the owner creates the Android app in the AdMob console;
        // without any value the Mobile Ads init provider throws on launch.
        // The default is Google's published test id, which never serves real
        // ads — override with -PADMOB_ANDROID_APP_ID=… or gradle.properties.
        manifestPlaceholders = [admobAppId: project.findProperty('ADMOB_ANDROID_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadKeystore) {
                storeFile file(uploadKeystore)
                storePassword releaseProp('MANORAMA_UPLOAD_STORE_PASSWORD')
                keyAlias releaseProp('MANORAMA_UPLOAD_KEY_ALIAS')
                keyPassword releaseProp('MANORAMA_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('manorama: MANORAMA_UPLOAD_KEYSTORE is not set — the release build will be unsigned')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
