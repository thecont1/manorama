[package]
name = "manorama-desktop"
version = "0.6.0"
description = "manorama local viewer for macOS"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "manorama_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset powers the asset:// scheme convertFileSrc resolves to —
# without it nothing local can render in the webview.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = { version = "=2.4.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-http = "2.7.0"
# Without apple-native the crate falls back to an in-memory mock store — each
# Entry owns a private RefCell, so set_password from one IPC call is invisible
# to get_password in the next and the vault key "persists" nowhere.
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1.20.0", features = ["v4"] }
# The verified metadata-only engine; shell policy stays in event_clustering.rs.
manorama_events = { package = "event-clustering", path = "../crates/event-clustering", features = ["fs-scan"] }
notify = "8"
# Resolve the OS's IANA rules, not today's offset (which loses historical DST).
iana-time-zone = "0.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
kamadak-exif = "0.6"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
