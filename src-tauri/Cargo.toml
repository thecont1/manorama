[package]
name = "manorama-desktop"
version = "0.1.0"
description = "manorama local viewer for macOS"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "manorama_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset powers the asset:// scheme convertFileSrc resolves to —
# without it nothing local can render in the webview.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
